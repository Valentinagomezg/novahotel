
spring.application.name=hotelnova

# Carga .env.floci (generado por scripts/floci-local.ps1) si existe.
# Las variables de entorno del sistema/IDE tienen prioridad sobre este archivo.
spring.config.import=optional:file:.env.floci[.properties]

# Azure SQL en la nube por defecto; en local apunta al SQL Server de floci-az.
# DB_URL se define en .env.floci o como variable de entorno.
spring.datasource.url=${DB_URL:jdbc:sqlserver://novah.database.windows.net:1433;databaseName=NovaHotelDB;encrypt=true;trustServerCertificate=false;loginTimeout=30;}

spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# "update" agrega automaticamente las columnas nuevas de verificacion de correo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

app.admin-code=1075652100

# URL publica de la aplicacion (se usa en los enlaces de los correos)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Configuracion de correo (Gmail por defecto).
# Define MAIL_USERNAME y MAIL_PASSWORD como variables de entorno.
# En Gmail debes usar una "Contrasena de aplicacion", no tu contrasena normal.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:reservas@novahotels.com}}
app.mail.from-name=NOVA Hotels

server.port=${SERVER_PORT:8080}
